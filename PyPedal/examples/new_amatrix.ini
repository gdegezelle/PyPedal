[default]
pedfile = new_amatrix.ped
pedname = A Large Dog Pedigree
# Columns: animal sire dam generation birthyear (see 2.0.4 inputoutput.tex).
# This file is historical evidence, not an active successful example.
# Dam 2047 is recorded as 1997 while named offspring are 1992-1996.
# RC4 chronology validation correctly refuses asdgb. Do not skip the year column.
pedformat = asdgb
sepchar = ' '
messages = verbose
renumber = 1
