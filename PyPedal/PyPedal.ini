###############################################################################
# PyPedal 4.0 example configuration
#
# Runtime looks for pypedal.ini in the CURRENT WORKING DIRECTORY when
# NewPedigree is constructed without an options dict. This file is a
# checkout template. It is not loaded from inside the installed package.
#
# Defaults here match NewPedigree.__init__ (4.0rc4). Override in your copy
# or pass a dict to load_pedigree(). Do not change production code to match
# an old 2.x ini.
#
# Original author: John B. Cole
# License: LGPL
###############################################################################

[default]
# Input
pedformat = asd
has_header = 0
pedname = Untitled
messages = verbose
pedigree_summary = 1

# IDs / order
renumber = 1
reorder = 0
slow_reorder = 1
reorder_max_rounds = 100

# Missing values
missing_parent = 0
# Unknown recorded birth year/date is None. Do not set missing_byear.
# To import old files that stored 1800 or 1900 as missing:
# legacy_missing_byear_token = 1800
missing_sex = u

# Load-time analysis (off unless you want them)
form_nrm = 0
set_generations = 0
set_ancestors = 0
set_sexes = 0
set_offspring = 0
set_alleles = 0
pedcomp = 0
gen_coeff = 0
matrix_type = sparse
validate = 1

# SNP: set snpfile to a path to load genotypes. P in pedformat is not a
# supported genotype recipe; use snpfile.
snpfile = 0

# Database: stdlib sqlite3 only. No SQLAlchemy / pyDAL / ADOdb.
database_type = sqlite
database_compatibility = sqlite

# Used by headless PDF reports (pyp_reports). Drawing uses pyp_graphics.
paper_size = letter
